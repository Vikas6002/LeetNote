{% extends 'base.html' %}
{% block title %}Delete Note — LeetNode{% endblock %}

{% block content %}
<div style="max-width:480px; margin:60px auto; text-align:center;">
    <div style="font-size:48px; margin-bottom:16px;">🗑</div>
    <h1 style="font-size:22px; font-weight:700; margin-bottom:8px;">Delete this note?</h1>
    <p style="color:#64748b; margin-bottom:28px;">
        "<strong style="color:#e2e8f0;">{{ note.title }}</strong>" will be permanently deleted.
    </p>
    <form method="POST" style="display:flex; gap:12px; justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'notes:detail' note.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
